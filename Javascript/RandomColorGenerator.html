<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Background Color</title>
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: background-color 0.5s ease-in-out;
            font-family: Arial, sans-serif;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: black;
            color: white;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover {
            background-color: gray;
        }

        .color-box {
            margin-top: 20px;
            height: 100px;
            width: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid black;
            cursor: pointer;
            transition: background-color 0.5s ease-in-out;
        }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9;">
<header style="background-color: #ffffff; color: #2c3e50; padding: 1rem 2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; width: 100%; box-sizing: border-box;">
        <div style="display: flex; align-items: center;">
            <a href="../index.html"><img src="../assets/logo.jpeg" alt="Logo" style="max-height: 40px;"></a>
        </div>
        <nav>
            <a href="../index.html" style="color: #2c3e50; text-decoration: none; margin: 0 15px; font-weight: bold;">Home</a>
            <a href="../Javascript/index.html" style="color: #2c3e50; text-decoration: none; margin: 0 15px; font-weight: bold;">Projects</a>
        </nav>
    </header>
    <button onclick="changeColor()">Change Background</button>
    <div class="color-box" onclick="copyToClipboard()"></div>

    <script>
        function generateHexColor() {
            let num = 'ABCDEF0123456789';
            let color = '';
            for (let x = 0; x < 6; x++) {
                color += num[Math.floor(Math.random() * 16)];
            }
            return '#' + color;
        }

        function changeColor() {
            let newColor = generateHexColor();
            document.body.style.backgroundColor = newColor;
            let colorBox = document.querySelector('.color-box');
            colorBox.textContent = newColor;
            colorBox.style.backgroundColor = newColor;
        }

        function copyToClipboard() {
            let colorCode = document.querySelector('.color-box').textContent;
            navigator.clipboard.writeText(colorCode).then(() => {
                alert("Copied to clipboard: " + colorCode);
            });
        }
    </script>
<footer style="background-color: #2c3e50; color: #ecf0f1; text-align: center; padding: 2rem 0; margin-top: auto; width: 100%; box-sizing: border-box;">
        <p style="margin: 0.5rem 0;">Daniel Vineel</p>
        <p style="margin: 0.5rem 0;">Connect with me on LinkedIn: <a href="https://www.linkedin.com/in/danielvineel" target="_blank" style="color: #3498db; text-decoration: none; font-weight: bold;">linkedin.com/in/danielvineel</a></p>
    </footer>
</body>
</html>
