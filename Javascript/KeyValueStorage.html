<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key-Value Storage</title>
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light" style="display: flex; flex-direction: column; min-height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9;">
<header style="background-color: #ffffff; color: #2c3e50; padding: 1rem 2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; width: 100%; box-sizing: border-box;">
        <div style="display: flex; align-items: center;">
            <a href="../index.html"><img src="../assets/logo.jpeg" alt="Logo" style="max-height: 40px;"></a>
        </div>
        <nav>
            <a href="../index.html" style="color: #2c3e50; text-decoration: none; margin: 0 15px; font-weight: bold;">Home</a>
            <a href="../Javascript/index.html" style="color: #2c3e50; text-decoration: none; margin: 0 15px; font-weight: bold;">Projects</a>
        </nav>
    </header>

    <!-- Centering the form vertically -->
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="container">
            <h2 class="text-center mb-4">Key-Value Storage</h2>

            <!-- Input Fields (Stacked Vertically) -->
            <div class="d-flex flex-column align-items-center">
                <input type="text" class="form-control mb-2 w-50" id="keyInput" placeholder="Enter key">
                <input type="text" class="form-control mb-2 w-50" id="valueInput" placeholder="Enter value">
                <button class="btn btn-primary w-50" onclick="check()">Submit</button>
            </div>

            <!-- Displaying Key-Value Pairs as Flexbox -->
            <div class="mt-4">
                <h4>Stored Key-Value Pairs</h4>
                <div class="d-flex flex-wrap gap-3" id="keyValueList">
                    <!-- Dynamically added key-value pairs will appear here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let dict = {};

        function check() {
            let key = document.getElementById('keyInput').value;
            let value = document.getElementById('valueInput').value;

            if (key && value) {
                if (dict[key] !== undefined) {
                    alert('Already present');
                    return;
                } else {
                    dict[key] = value;
                    alert('Success');
                    updateList();
                }
            } else {
                alert('Please enter both key and value.');
            }

            // Clear inputs after submission
            document.getElementById('keyInput').value = '';
            document.getElementById('valueInput').value = '';
        }

        // Function to update the list of key-value pairs
        function updateList() {
            const keyValueList = document.getElementById('keyValueList');
            keyValueList.innerHTML = ''; // Clear the list first

            for (let key in dict) {
                let card = document.createElement('div');
                card.classList.add('border', 'rounded', 'p-3', 'bg-white', 'shadow-sm', 'd-flex', 'flex-column', 'align-items-center');

                card.innerHTML = `
                    <strong>${key}</strong>
                    <p class="text-muted">${dict[key]}</p>
                    <div class="d-flex gap-2">
                        <button class="btn btn-warning btn-sm" onclick="edit('${key}')">Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteKey('${key}')">Delete</button>
                    </div>
                `;
                keyValueList.appendChild(card);
            }
        }

        // Function to edit a key-value pair
        function edit(key) {
            let newValue = prompt('Enter new value for ' + key, dict[key]);
            if (newValue !== null) {
                dict[key] = newValue;
                updateList();
            }
        }

        // Function to delete a key-value pair
        function deleteKey(key) {
            if (confirm(`Are you sure you want to delete the key "${key}"?`)) {
                delete dict[key];
                updateList();
            }
        }
    </script>

<footer style="background-color: #2c3e50; color: #ecf0f1; text-align: center; padding: 2rem 0; margin-top: auto; width: 100%; box-sizing: border-box;">
        <p style="margin: 0.5rem 0;">Daniel Vineel</p>
        <p style="margin: 0.5rem 0;">Connect with me on LinkedIn: <a href="https://www.linkedin.com/in/danielvineel" target="_blank" style="color: #3498db; text-decoration: none; font-weight: bold;">linkedin.com/in/danielvineel</a></p>
    </footer>
</body>
</html>
