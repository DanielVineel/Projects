<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Analyzer</title>
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100" style="display: flex; flex-direction: column; min-height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9;">
<header style="background-color: #ffffff; color: #2c3e50; padding: 1rem 2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; width: 100%; box-sizing: border-box;">
        <div style="display: flex; align-items: center;">
            <a href="../index.html"><img src="../assets/logo.jpeg" alt="Logo" style="max-height: 40px;"></a>
        </div>
        <nav>
            <a href="../index.html" style="color: #2c3e50; text-decoration: none; margin: 0 15px; font-weight: bold;">Home</a>
            <a href="../Javascript/index.html" style="color: #2c3e50; text-decoration: none; margin: 0 15px; font-weight: bold;">Projects</a>
        </nav>
    </header>

    <div class="container text-center">
        <h2 class="mb-4">Character Analyzer</h2>

        <input type="text" id="textInput" class="form-control mb-3" placeholder="Enter text..." oninput="analyzeText()">

        <div class="alert alert-dark">
            <strong>Total Characters:</strong> <span id="totalCount">0</span>
        </div>

        <div class="row">
            <div class="col-md-3">
                <div class="alert alert-primary">Vowels: <strong id="vowelCount">0</strong></div>
            </div>
            <div class="col-md-3">
                <div class="alert alert-success">Consonants: <strong id="consonantCount">0</strong></div>
            </div>
            <div class="col-md-3">
                <div class="alert alert-warning">Numbers: <strong id="numberCount">0</strong></div>
            </div>
            <div class="col-md-3">
                <div class="alert alert-danger">Special Characters: <strong id="specialCount">0</strong></div>
            </div>
        </div>
    </div>

    <script>
        function analyzeText() {
            let input = document.getElementById("textInput").value;
            let vowels = "AEIOUaeiou";
            let numbers = "0123456789";

            let vowelCount = 0, consonantCount = 0, numberCount = 0, specialCount = 0;

            for (let char of input) {
                if (vowels.includes(char)) {
                    vowelCount++;
                } else if (numbers.includes(char)) {
                    numberCount++;
                } else if (char.match(/[a-zA-Z]/)) {
                    consonantCount++;
                } else {
                    specialCount++;
                }
            }

            document.getElementById("totalCount").textContent = input.length;
            document.getElementById("vowelCount").textContent = vowelCount;
            document.getElementById("consonantCount").textContent = consonantCount;
            document.getElementById("numberCount").textContent = numberCount;
            document.getElementById("specialCount").textContent = specialCount;
        }
    </script>

<footer style="background-color: #2c3e50; color: #ecf0f1; text-align: center; padding: 2rem 0; margin-top: auto; width: 100%; box-sizing: border-box;">
        <p style="margin: 0.5rem 0;">Daniel Vineel</p>
        <p style="margin: 0.5rem 0;">Connect with me on LinkedIn: <a href="https://www.linkedin.com/in/danielvineel" target="_blank" style="color: #3498db; text-decoration: none; font-weight: bold;">linkedin.com/in/danielvineel</a></p>
    </footer>
</body>
</html>
