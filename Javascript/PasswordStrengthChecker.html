<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .main {
            width: 350px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            margin-bottom: 10px;
        }

        .strength-bar {
            width: 100%;
            height: 10px;
            background: lightgray;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }

        .requirements {
            text-align: left;
            font-size: 14px;
            margin-top: 10px;
        }

        .requirements p {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }

        .requirements span {
            margin-right: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9;">
<header style="background-color: #ffffff; color: #2c3e50; padding: 1rem 2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; width: 100%; box-sizing: border-box;">
        <div style="display: flex; align-items: center;">
            <a href="../index.html"><img src="../assets/logo.jpeg" alt="Logo" style="max-height: 40px;"></a>
        </div>
        <nav>
            <a href="../index.html" style="color: #2c3e50; text-decoration: none; margin: 0 15px; font-weight: bold;">Home</a>
            <a href="../Javascript/index.html" style="color: #2c3e50; text-decoration: none; margin: 0 15px; font-weight: bold;">Projects</a>
        </nav>
    </header>

    <div class="main">
        <h2>Password Strength Checker</h2>
        <input type="text" placeholder="Enter your password" name="pwd" oninput="checkPasswordStrength()">

        <div class="strength-bar">
            <div class="strength-fill"></div>
        </div>

        <div class="requirements">
            <p id="p1"><span>❌</span> Minimum 6 characters required</p>
            <p id="p2"><span>❌</span> At least one uppercase letter</p>
            <p id="p3"><span>❌</span> At least one lowercase letter</p>
            <p id="p4"><span>❌</span> At least one number</p>
            <p id="p5"><span>❌</span> At least one special character</p>
        </div>
    </div>

<script>
    function checkPasswordStrength() {
        let pwd = document.getElementsByName('pwd')[0].value;
        let strengthBar = document.querySelector('.strength-fill');
        let criteria = {
            length: pwd.length >= 6,
            upper: /[A-Z]/.test(pwd),
            lower: /[a-z]/.test(pwd),
            number: /[0-9]/.test(pwd),
            special: /[\W_]/.test(pwd)
        };

        let strength = Object.values(criteria).filter(Boolean).length -1 ;
        let strengthLevels = ['red', 'orange', 'yellow', 'green', 'blue'];
        let strengthWidth = ['10%', '30%', '50%', '75%', '100%'];

        strengthBar.style.width = strengthWidth[strength];
        strengthBar.style.backgroundColor = strengthLevels[strength];

        document.getElementById('p1').innerHTML = criteria.length ? '✔️ Minimum 6 characters required' : '❌ Minimum 6 characters required';
        document.getElementById('p2').innerHTML = criteria.upper ? '✔️ At least one uppercase letter' : '❌ At least one uppercase letter';
        document.getElementById('p3').innerHTML = criteria.lower ? '✔️ At least one lowercase letter' : '❌ At least one lowercase letter';
        document.getElementById('p4').innerHTML = criteria.number ? '✔️ At least one number' : '❌ At least one number';
        document.getElementById('p5').innerHTML = criteria.special ? '✔️ At least one special character' : '❌ At least one special character';
    }
</script>

<footer style="background-color: #2c3e50; color: #ecf0f1; text-align: center; padding: 2rem 0; margin-top: auto; width: 100%; box-sizing: border-box;">
        <p style="margin: 0.5rem 0;">Daniel Vineel</p>
        <p style="margin: 0.5rem 0;">Connect with me on LinkedIn: <a href="https://www.linkedin.com/in/danielvineel" target="_blank" style="color: #3498db; text-decoration: none; font-weight: bold;">linkedin.com/in/danielvineel</a></p>
    </footer>
</body>
</html>
